<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/inscricao.css">
    <title>Inscrição no evento - EAS</title>
</head>
<body>
    <div id="header-container"></div>

    <main>
        <section class="inscricao" aria-labelledby="titulo-inscricao">
            <h1 id="titulo-inscricao">Inscrever-se no evento</h1>

            <form action="#" method="post" id="form-inscricao" class="inscricao-card">

                    <!-- Programação -->
                    <fieldset class="inscricao-fieldset">
                        <legend><h3>Programação e Local Evento:</h3></legend>

                        <label class="checkbox-label atividade">
                            <input type="checkbox" name="atividades" value="seguranca-digital" class="checkbox-input">
                            <span class="atividade-info">
                                <span class="atividade-titulo">Palestra: Segurança Digital.</span>
                                <span>Palestrante: Fulano1</span>
                                <span>Horário: das 8h às 9h.</span>
                            </span>
                        </label>

                        <label class="checkbox-label atividade">
                            <input type="checkbox" name="atividades" value="inteligencia-artificial" class="checkbox-input">
                            <span class="atividade-info">
                                <span class="atividade-titulo">Palestra: Inteligência Artificial no Dia a Dia.</span>
                                <span>Palestrante: Fulano2</span>
                                <span>Horário: 9:30h às 10:30h.</span>
                            </span>
                        </label>

                        <label class="checkbox-label atividade">
                            <input type="checkbox" name="atividades" value="workshop-web" class="checkbox-input">
                            <span class="atividade-info">
                                <span class="atividade-titulo">Workshop: Introdução ao Desenvolvimento Web</span>
                                <span>Palestrante: Fulano 1.</span>
                                <span>Horário: das 14h às 17h.</span>
                            </span>
                        </label>

                        <label class="checkbox-label atividade">
                            <input type="checkbox" name="atividades" value="carreiras-ti" class="checkbox-input" checked>
                            <span class="atividade-info">
                                <span class="atividade-titulo">Palestra e Debate: Carreiras na Área da (TI).</span>
                                <span>Palestrante: Fulano 3.</span>
                                <span>Horário: das 20h às 22h.</span>
                            </span>
                        </label>
                    </fieldset>

                    <!-- Palestrantes (as imagens entram depois) -->
                    <aside class="palestrantes" aria-label="Palestrantes">
                        <figure class="palestrante">
                            <div class="palestrante-foto"></div>
                            <!-- <img class="palestrante-foto" src="assets/img/fulano1.jpg" alt="Foto de Fulano 1"> -->
                            <figcaption><h2>Fulano 1</h2></figcaption>
                        </figure>

                        <figure class="palestrante">
                            <div class="palestrante-foto"></div>
                            <figcaption><h2>Fulano 2</h2></figcaption>
                        </figure>

                        <figure class="palestrante">
                            <div class="palestrante-foto"></div>
                            <figcaption><h2>Fulano 3</h2></figcaption>
                        </figure>
                    </aside>


                <div class="inscricao-acoes">
                    <input type="submit" class="botao-confirmacao btn-grande" value="Fazer Inscrição">
                </div>
            </form>
        </section>
    </main>
    <div id="footer-container"></div>

    <script src="./assets/js/componente.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
