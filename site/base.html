<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Template</title>
</head>
<body>
    <header class="cabecalho">
        <figure class="logo-figure">
            <img src="assets/img/Logo.svg" alt="Logo EAS">
            <h1>EAS</h1>
        </figure>
        <a href="#"><ion-icon name="add-outline" class="icons-cabecalho"></ion-icon>Criar Conta</a>
        <a href="#"><ion-icon name="log-in-outline" class="icons-cabecalho"></ion-icon>Entrar</a>
        <nav class="navbar">
            <div class="navbar-container">
                <input type="checkbox" name="" id="">
                    <div class="hamburger-lines">
                        <span class="line line1"></span>
                        <span class="line line2"></span>
                        <span class="line line3"></span>
                    </div>
                </div>
        </nav>
    </header>
    <main>
        <h1>Template de site</h1>

        <h2>Subtitulo 1</h2>

        <h3>Subtitulo 2</h3>


        <h2>Exemplo de form</h2>
        <form action="#" method="get" id="form-exemplo">
            <fieldset>
                <legend>Exemplos de input</legend>
                <label for="campo1" class="texto-label">Input: </label>
                <input type="text" class="campo-texto" placeholder="Template" id="campo1">
                <label for="campo2" class="texto-label">Input: </label>
                <input type="text" class="campo-texto" placeholder="Template" id="campo2">
                <label for="campo3" class="texto-label">Input: </label>
                <input type="text" class="campo-texto" placeholder="Template" id="campo3">
            </fieldset> 
            <fieldset class="exemplo-radio-checkbox">
                <legend>Exemplo de radio e checkbox</legend>
                <div class="radios">
                    <label for="radio1" class="radio-label">
                        <input type="radio" class="radio-input" name="Teste" id="radio1">
                        Radio
                    </label>
                    <label for="radio2" class="radio-label">
                        <input type="radio" class="radio-input" name="Teste" id="radio2">
                        Radio
                    </label>
                    <label for="radio3" class="radio-label">
                        <input type="radio" class="radio-input" name="Teste" id="radio3">
                        Radio
                    </label>
                </div>
                <div class="checks">
                    <label for="checkbox1" class="checkbox-label">
                        <input type="checkbox" name="checkbox" class="checkbox-input" id="checkbox1">
                        Checkbox
                    </label>
                    <label for="checkbox2" class="checkbox-label">
                        <input type="checkbox" name="checkbox" class="checkbox-input" id="checkbox2">
                        Checkbox
                    </label>
                    <label for="checkbox3" class="checkbox-label">
                        <input type="checkbox" name="checkbox" class="checkbox-input" id="checkbox3">
                        Checkbox
                    </label>
                </div>
            </fieldset>
            <fieldset class="exemplo-select">
                <legend>Exemplo de Select</legend>
                <div class="select-container">
                    <select name="Selecao" id="Select" class="selecao">
                        <option value="#" class="Opcaos">Opção 1</option>
                        <option value="#" class="Opcaos">Opção 2</option>
                        <option value="#" class="Opcaos">Opção 3</option>
                        <option value="#" class="Opcaos">Selecione</option>    
                    </select>
                </div>
                </fieldset>
        </form>
    </main>
    <footer class="rodape">
        <figure class="logo-figure">
            <img src="assets/img/Logo.svg" alt="Logo EAS">
            <h1>EAS</h1>
        </figure>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
        <a href="#">Termos</a>
        <p class="copywrite">©EAS 2026</p>
    </footer>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
