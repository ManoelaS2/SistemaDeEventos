<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha | EAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <section id="section-recuperar-senha" class="secao-cartao">
      <main class="cartao">
        <h1>Recuperar senha</h1>
        <p class="texto-intro">
          Esqueceu sua senha? Sem problemas. Digite o e-mail cadastrado na sua
          conta e enviaremos um link para redefinir sua senha.
        </p>

        <form action="verificar-codigo.html" method="get" id="form-recuperar-senha" class="form-cartao">
          <label for="campo-email" class="texto-oculto">E-mail</label>
          <input
            type="email"
            class="campo-email"
            placeholder="E-mail"
            id="campo-email"
            name="email"
            autocomplete="email"
            required
          />
          <input class="btn-confirmacao btn-compacto" type="submit" value="Enviar link" />
        </form>

        <a href="login.html" class="link-cartao"><span aria-hidden="true">&larr;</span> Voltar para o login</a>
      </main>
    </section>

    <div id="footer-container"></div>
    <script src="./assets/js/componente.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>
</html>
