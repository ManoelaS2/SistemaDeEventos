<!doctype html>
<!-- Página inicial: todos os eventos, capas e categorias são consultados no banco e inseridos por JavaScript. O HTML contém somente a estrutura da tela. -->
<html lang="pt-BR">
  <!--
    Metadados do documento: UTF-8 permite acentos; viewport adapta a largura ao dispositivo;
    title identifica a aba e a página para tecnologias assistivas.
  -->
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EAS</title>
    <!--
      Estilos em camadas: variáveis, base, componentes, layout e ajustes da página. A ordem
      importa, pois regras posteriores podem complementar ou substituir regras anteriores.
    -->
    <link href="assets/css/variaveis.css" rel="stylesheet" />
    <link href="assets/css/base.css" rel="stylesheet" />
    <link href="assets/css/componentes.css" rel="stylesheet" />
    <link href="assets/css/layout.css" rel="stylesheet" />
    <link href="assets/css/paginas/home.css" rel="stylesheet" />
    <!--
      O tema é aplicado cedo para reduzir a troca de cores após a página aparecer. A preferência
      fica em localStorage, separada dos registros do banco.
    -->
    <script src="assets/js/tema.js"></script>
    <link href="assets/css/funcionalidades.css" rel="stylesheet" />
  </head>
  <!--
    Conteúdo visível. Classes no body permitem que o CSS aplique ajustes somente a esta tela.
  -->
  <body class="page-home">
    <!--
      O cabeçalho não está repetido neste arquivo. componente.js busca includes/header.html e
      preenche este contêiner antes de app.js montar a navegação.
    -->
    <div id="header-container"></div>
    <!--
      Região principal da página: main identifica o conteúdo central. Os IDs e classes também
      são pontos de ligação com app.js; alterá-los exige revisar os seletores do script.
    -->
    <main>
      <!--
        Seção temática: Eventos em destaque. O agrupamento organiza o conteúdo; as classes
        determinam sua apresentação no CSS.
      -->
      <section aria-labelledby="hero-title" class="destaque">
        <h1 class="destaque-titulo" id="hero-title">Eventos em destaque</h1>
        <div class="destaque-carrossel">
          <button
            aria-label="Evento anterior"
            class="botao-icone botao-icone--carrossel"
            type="button"
          >
            <ion-icon aria-hidden="true" name="chevron-back"> </ion-icon>
          </button>
          <a aria-label="Conhecer o evento em destaque" class="destaque-imagem">
            Carregando destaque…
          </a>
          <button
            aria-label="Próximo evento"
            class="botao-icone botao-icone--carrossel"
            type="button"
          >
            <ion-icon aria-hidden="true" name="chevron-forward"> </ion-icon>
          </button>
        </div>
        <div class="eas-convite">
          <p>Organize palestras, oficinas e outros encontros.</p>
          <a class="btn-confirmacao" href="criar-evento.html"> Criar evento </a>
        </div>
      </section>
      <!--
        Seção temática: Conheça nossas categorias. O agrupamento organiza o conteúdo; as classes
        determinam sua apresentação no CSS.
      -->
      <section
        aria-labelledby="categories-title"
        class="secao secao--categorias"
      >
        <div class="secao-cabecalho">
          <h2 id="categories-title">Conheça nossas categorias</h2>
          <a class="link-destaque" href="#eventos"> Ver tudo </a>
        </div>
        <div class="grade grade--categorias">
          <!-- Conteúdo criado por app.js a partir dos registros do banco; não cadastre eventos diretamente neste HTML. -->
          <p class="eas-carregamento" role="status">Carregando categorias…</p>
        </div>
      </section>
      <!--
        Seção temática: Eventos em andamento. O agrupamento organiza o conteúdo; as classes
        determinam sua apresentação no CSS.
      -->
      <section
        aria-labelledby="events-title"
        class="secao secao--eventos"
        id="eventos"
      >
        <div class="secao-cabecalho">
          <h2 id="events-title">Explore os eventos</h2>
          <a class="link-destaque" href="#eventos"> Ver tudo </a>
        </div>
        <div aria-busy="true" class="grade grade--eventos">
          <!-- Conteúdo criado por app.js a partir dos registros do banco; não cadastre eventos diretamente neste HTML. -->
          <p class="eas-carregamento" role="status">
            Carregando eventos do banco…
          </p>
        </div>
      </section>
    </main>
    <!--
      Este contêiner recebe includes/footer.html. Assim uma alteração no rodapé compartilhado
      pode atender todas as páginas.
    -->
    <div id="footer-container"></div>
    <!--
      Carrega os fragmentos compartilhados e registra interações comuns. componentesProntos
      informa quando cabeçalho e rodapé já estão disponíveis.
    -->
    <script src="./assets/js/componente.js"></script>
    <!--
      Biblioteca externa para os elementos ion-icon. Os ícones são apresentação; informações
      importantes também precisam de texto ou nome acessível.
    -->
    <script
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
      type="module"
    ></script>
    <script
      nomodule=""
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <!--
      Módulo principal: type=module permite import/export e aguarda a leitura do HTML. app.js
      importa banco.js, verifica a sessão e conecta os controles desta página.
    -->
    <script src="assets/js/app.js" type="module"></script>
  </body>
</html>
