<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Criar conta | EAS</title>
</head>
<body class="page-login page-secondary">
  <div id="header-container"></div>
  <main class="interior-page">
  <section class="simple-card signup-card">
    <div class="simple-avatar"><ion-icon name="person-add-outline"></ion-icon></div>
    <h1>Cadastre-se</h1>
    <form data-demo-redirect="login.html" class="simple-form">
      <label>Nome completo<input required name="nome" autocomplete="name" placeholder="Nome completo"></label>
      <label>E-mail ou CPF<input required name="email" autocomplete="email" placeholder="E-mail ou CPF"></label>
      <label>Crie uma senha<input required name="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha"></label>
      <label>Confirmar senha<input required name="confirmar" type="password" autocomplete="new-password" placeholder="Confirmar senha"></label>
      <small>Ao criar sua conta, você concorda com os Termos de Uso.</small>
      <button class="btn-confirmacao btn-compacto" type="submit">Criar conta</button>
    </form>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </section>
</main>
  <div id="footer-container"></div>
  <script src="./assets/js/componente.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
