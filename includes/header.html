<!--
  Fragmento compartilhado: contém cabeçalho, busca e navegação. componente.js o insere no
  contêiner header-container; não é um documento HTML completo.
-->
<header class="site-header">
  <div class="header-inner">
    <a aria-label="EAS - Página inicial" class="brand" href="index.html">
      <img alt="" src="assets/img/logo-icon.png" class="brand-img">
      <span>
        EAS
      </span>
    </a>
    <!--
      Busca com nome acessível. O campo busca pode viajar na URL por GET porque contém um termo
      de pesquisa, não uma senha.
    -->
    <form action="index.html" class="header-search" method="get" role="search">
      <ion-icon aria-hidden="true" name="search-outline"></ion-icon>
      <input aria-label="Buscar eventos" name="busca" placeholder="Buscar eventos" type="search">
    </form>
    <!--
      nav reúne links de navegação. aria-label explica a finalidade deste conjunto quando há
      mais de um menu na página.
    -->
    <nav aria-label="Navegação principal" class="main-nav" id="main-nav">
      <button class="nav-location" type="button">
        <ion-icon name="location"></ion-icon>
        Todos os lugares
        <ion-icon name="chevron-down-outline"></ion-icon>
      </button>
      <a class="home-only" href="editar-atividade-evento.html">
        <ion-icon name="calendar-outline"></ion-icon>
        Meus Eventos
      </a>
      <a class="home-only" href="login.html">
        <ion-icon name="person-circle-outline"></ion-icon>
        Usuário
      </a>
      <a class="login-only" href="cadastro.html">
        <ion-icon name="add-outline"></ion-icon>
        Criar conta
      </a>
      <a class="login-only" href="login.html">
        <ion-icon name="log-in-outline"></ion-icon>
        Entrar
      </a>
      <button aria-label="Alternar tema" class="theme-button" type="button">
        <ion-icon name="moon"></ion-icon>
      </button>
    </nav>
    <button aria-controls="main-nav" aria-expanded="false" aria-label="Abrir menu" class="menu-toggle" id="menu-toggle" type="button">
      <span aria-hidden="true">
        ☰
      </span>
    </button>
  </div>
</header>
<span class="spam-header"></span>
